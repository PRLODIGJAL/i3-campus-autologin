[account]
; 学号（填写你自己的）
userId =
; 密码（填写你自己的，明文保存在本机，不要把这个文件发给别人）
password =
; 认证服务/运营商，本校为空，留空即可
service =
; 认证跳转参数。留空 = 每次断网时自动抓取（推荐先留空）
; 如果自动抓取失败（登录提示"设备未注册"），断网时双击「5-抓取认证参数.bat」会自动填到这里
queryString =

[options]
; 后台检测间隔（秒），15~30 比较合适
interval = 15
; 校园网门户直连 IP（login.dgut.edu.cn）。断网时 DNS 往往一起挂掉，
; 用 IP 直连才能把登录请求发出去。学校换服务器时改这里或留空自动解析
portalIp = 172.31.252.91
